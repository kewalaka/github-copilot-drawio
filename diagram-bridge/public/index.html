<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local architecture editor</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script><script src="/app.js" defer></script>
</head>
<body>
  <header>
    <strong>Architecture editor</strong>
    <span class="badge">Local only</span>
    <span id="status" role="status">Connecting…</span>
    <button id="save" disabled title="Edits save automatically. Render and save the same editable SVG again, or retry a failed save.">Save now</button>
    <button id="preview">SVG preview</button>
    <button id="open-drawio" disabled>Open in Draw.io</button>
    <button id="resume" hidden disabled>Resume here</button>
  </header>
  <main><iframe id="editor" title="draw.io architecture editor"></iframe><div id="busy" hidden>Saving diagram…</div></main>
</body>
</html>
